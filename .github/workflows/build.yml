name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare project
        run: |
          unzip -o hifz_app.zip -d src
          flutter create --org com.hifz --project-name hifz --platforms=android app
          rm -rf app/lib
          cp -r src/lib app/lib
          cp -r src/assets app/assets
          mkdir -p app/assets/fonts
          curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf" -o app/assets/fonts/ArefRuqaa-Bold.ttf || curl -fsSL "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/arefruqaa/ArefRuqaa-Bold.ttf" -o app/assets/fonts/ArefRuqaa-Bold.ttf
          ls -la app/assets/fonts
          cp src/pubspec.yaml app/pubspec.yaml
          sed -i 's/android:label="[^"]*"/android:label="حفظ"/' app/android/app/src/main/AndroidManifest.xml
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hifz-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
