name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare project
        run: |
          unzip -o hifz_app.zip -d src
          flutter create --org com.hifz --project-name hifz --platforms=android app
          rm -rf app/lib
          cp -r src/lib app/lib
          cp -r src/assets app/assets
          mkdir -p app/assets/fonts
          curl -fsSL https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf -o app/assets/fonts/ArefRuqaa-Bold.ttf || curl -fsSL https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/arefruqaa/ArefRuqaa-Bold.ttf -o app/assets/fonts/ArefRuqaa-Bold.ttf
          # خطوط القراءة (إن تعذّر تحميل أحدها يُستبدل بخط أميري قرآن حتى لا يفشل البناء)
          getfont() {
            rm -f "app/assets/fonts/$2"
            curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/$1/$2" -o "app/assets/fonts/$2" \
              || curl -fsSL "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/$1/$2" -o "app/assets/fonts/$2" \
              || rm -f "app/assets/fonts/$2"
          }
          getfont amiriquran AmiriQuran-Regular.ttf
          getfont amiri Amiri-Regular.ttf
          getfont scheherazadenew ScheherazadeNew-Regular.ttf
          getfont lateef Lateef-Regular.ttf
          [ -s app/assets/fonts/AmiriQuran-Regular.ttf ] || cp app/assets/fonts/ArefRuqaa-Bold.ttf app/assets/fonts/AmiriQuran-Regular.ttf
          for f in Amiri-Regular ScheherazadeNew-Regular Lateef-Regular; do
            [ -s app/assets/fonts/$f.ttf ] || cp app/assets/fonts/AmiriQuran-Regular.ttf app/assets/fonts/$f.ttf
          done
          ls -la app/assets/fonts
          cp src/pubspec.yaml app/pubspec.yaml
          sed -i 's/android:label=\x22[^\x22]*\x22/android:label=\x22المصطفون\x22/' app/android/app/src/main/AndroidManifest.xml
          find app/android/app/src/main/res -name styles.xml -exec sed -i 's#<style name=\x22[A-Za-z]*Theme\x22.*>#&\n        <item name=\x22android:windowLayoutInDisplayCutoutMode\x22>shortEdges</item>#' {} +
      - name: Add home screen widget (Android)
        run: |
          MAIN=$(find app/android/app/src/main -name MainActivity.kt | head -n 1)
          KDIR=$(dirname "$MAIN")
          PKG=$(grep -m1 '^package ' "$MAIN" | awk '{print $2}')
          echo "package=$PKG dir=$KDIR"
          RES=app/android/app/src/main/res
          mkdir -p $RES/layout $RES/xml $RES/drawable
          sed "s/__PKG__/$PKG/g" src/android_extra/WirdWidgetProvider.kt > "$KDIR/WirdWidgetProvider.kt"
          cp src/android_extra/wird_widget.xml $RES/layout/wird_widget.xml
          cp src/android_extra/wird_widget_info.xml $RES/xml/wird_widget_info.xml
          cp src/android_extra/widget_bg.xml $RES/drawable/widget_bg.xml
          python3 - "$PKG" <<'PY'
          import sys
          pkg = sys.argv[1]
          p = 'app/android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          r = ('    <receiver android:name="' + pkg + '.WirdWidgetProvider" android:exported="true">\n'
               '        <intent-filter>\n'
               '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>\n'
               '        </intent-filter>\n'
               '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/wird_widget_info"/>\n'
               '    </receiver>\n')
          assert '</application>' in s
          s = s.replace('</application>', r + '    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
          cat app/android/app/src/main/AndroidManifest.xml
      - name: Add reminders / notifications (Android)
        run: |
          python3 <<'PY'
          import glob, re
          # 1) الصلاحيات والمستقبِلات في AndroidManifest
          p = 'app/android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ('    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n'
                   '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n'
                   '    <uses-permission android:name="android.permission.VIBRATE"/>\n')
          recv = ('    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>\n'
                  '    <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '        <intent-filter>\n'
                  '            <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '            <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '            <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
                  '            <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
                  '        </intent-filter>\n'
                  '    </receiver>\n')
          assert '<application' in s and '</application>' in s
          s = s.replace('<application', perms + '    <application', 1)
          s = s.replace('</application>', recv + '    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          # 2) تفعيل desugaring في build.gradle (يدعم Groovy و Kotlin DSL)
          f = glob.glob('app/android/app/build.gradle*')[0]
          g = open(f, encoding='utf-8').read()
          kts = f.endswith('.kts')
          flag = 'isCoreLibraryDesugaringEnabled = true' if kts else 'coreLibraryDesugaringEnabled true'
          dep = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if kts
                 else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")
          assert 'compileOptions {' in g
          g = g.replace('compileOptions {', 'compileOptions {\n        ' + flag, 1)
          if re.search(r'^dependencies\s*\{', g, re.M):
              g = re.sub(r'^(dependencies\s*\{)', lambda m: m.group(1) + '\n    ' + dep, g, count=1, flags=re.M)
          else:
              g += '\ndependencies {\n    ' + dep + '\n}\n'
          open(f, 'w', encoding='utf-8').write(g)
          print(open(f, encoding='utf-8').read())
          PY
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: hifz-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
