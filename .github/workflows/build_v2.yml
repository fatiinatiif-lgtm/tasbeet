name: Build APK v2
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [lite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Prepare project
        run: |
          unzip -o hifz_v2.zip -d src
          flutter create --org com.hayat --project-name hifz --platforms=android app
          rm -rf app/lib
          cp -r src/lib app/lib
          cp -r src/assets app/assets
          mkdir -p app/assets/fonts
          curl -fsSL https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf -o app/assets/fonts/ArefRuqaa-Bold.ttf || curl -fsSL https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/arefruqaa/ArefRuqaa-Bold.ttf -o app/assets/fonts/ArefRuqaa-Bold.ttf
          getfont() {
            rm -f "app/assets/fonts/$2"
            curl -fsSL "https://raw.githubusercontent.com/google/fonts/main/ofl/$1/$2" -o "app/assets/fonts/$2" \
              || curl -fsSL "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/$1/$2" -o "app/assets/fonts/$2" \
              || rm -f "app/assets/fonts/$2"
          }
          getfont amiriquran AmiriQuran-Regular.ttf
          getfont amiri Amiri-Regular.ttf
          getfont scheherazadenew ScheherazadeNew-Regular.ttf
          getfont lateef Lateef-Regular.ttf
          [ -s app/assets/fonts/AmiriQuran-Regular.ttf ] || cp app/assets/fonts/ArefRuqaa-Bold.ttf app/assets/fonts/AmiriQuran-Regular.ttf
          for f in Amiri-Regular ScheherazadeNew-Regular Lateef-Regular; do
            [ -s app/assets/fonts/$f.ttf ] || cp app/assets/fonts/AmiriQuran-Regular.ttf app/assets/fonts/$f.ttf
          done
          ls -la app/assets/fonts
          cp src/pubspec.yaml app/pubspec.yaml
          sed -i 's/android:label=\x22[^\x22]*\x22/android:label=\x22حياة بالقرآن\x22/' app/android/app/src/main/AndroidManifest.xml
          find app/android/app/src/main/res -name styles.xml -exec sed -i 's#<style name=\x22[A-Za-z]*Theme\x22.*>#&\n        <item name=\x22android:windowLayoutInDisplayCutoutMode\x22>shortEdges</item>#' {} +
      - name: Lite variant (بدون ويدجت الشاشة الرئيسية)
        if: matrix.variant == 'lite'
        run: |
          sed -i '/home_widget:/d' app/pubspec.yaml
          cat > app/lib/core/home_widget_sync.dart <<'DART'
          import '../features/wird/wird_provider.dart';

          Future<void> syncHomeWidget(WirdState s) async {}
          DART
      - name: Add home screen widget (Android)
        if: matrix.variant == 'full'
        run: |
          MAIN=$(find app/android/app/src/main -name MainActivity.kt | head -n 1)
          KDIR=$(dirname "$MAIN")
          PKG=$(grep -m1 '^package ' "$MAIN" | awk '{print $2}')
          echo "package=$PKG dir=$KDIR"
          RES=app/android/app/src/main/res
          mkdir -p $RES/layout $RES/xml $RES/drawable
          sed "s/__PKG__/$PKG/g" src/android_extra/WirdWidgetProvider.kt > "$KDIR/WirdWidgetProvider.kt"
          cp src/android_extra/wird_widget.xml $RES/layout/wird_widget.xml
          cp src/android_extra/wird_widget_info.xml $RES/xml/wird_widget_info.xml
          cp src/android_extra/widget_bg.xml $RES/drawable/widget_bg.xml
          python3 - "$PKG" <<'PY'
          import sys
          pkg = sys.argv[1]
          p = 'app/android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          r = ('    <receiver android:name="' + pkg + '.WirdWidgetProvider" android:exported="true">\n'
               '        <intent-filter>\n'
               '            <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>\n'
               '        </intent-filter>\n'
               '        <meta-data android:name="android.appwidget.provider" android:resource="@xml/wird_widget_info"/>\n'
               '    </receiver>\n')
          assert '</application>' in s
          s = s.replace('</application>', r + '    </application>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY
      - name: Android setup (Impeller off, notifications skipped)
        run: python3 src/android_extra/setup_notifications.py
      - name: Show final manifest
        run: cat app/android/app/src/main/AndroidManifest.xml
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          dart run flutter_launcher_icons
          flutter build apk --release --no-shrink
      - uses: actions/upload-artifact@v4
        with:
          name: hifz-${{ matrix.variant }}-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
